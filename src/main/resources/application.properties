spring.application.name=meter-publisher

# MQTT. topic-pattern 의 {deviceCode} 자리에 장비 코드가 들어간다
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=meter-publisher-001
mqtt.topic-pattern=meter/{deviceCode}/energy
mqtt.qos=1
# 브로커 인증을 켠 경우에만 설정 (EC2 등)
#mqtt.username=
#mqtt.password=

# 1분마다 측정값 발행. 테스트에서는 끈다 (src/test/resources/config/application.properties)
meter.scheduler.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3307/meter
spring.datasource.username=meter
spring.datasource.password=meter
